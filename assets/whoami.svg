<svg viewBox="0 0 1000 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Subject profile — bio, focus, environment, membership">
  <style>
    :root { --panel:#111318; --line:#2a2d33; --ink:#dde1e6; --dim:#6f7580; --signal:#b0552e; }
    .mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;}
    .rise{opacity:0;animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards;}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .d1{animation-delay:.05s}.d2{animation-delay:.14s}.d3{animation-delay:.23s}.d4{animation-delay:.34s}.d5{animation-delay:.43s}.d6{animation-delay:.52s}
    @media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1}}
  </style>

  <rect x="1" y="1" width="998" height="248" rx="4" fill="var(--panel)" stroke="var(--line)"/>
  <path d="M1 17 V1 H17" stroke="var(--dim)" fill="none"/>
  <path d="M983 1 H999 V17" stroke="var(--dim)" fill="none"/>
  <path d="M999 233 V249 H983" stroke="var(--dim)" fill="none"/>
  <path d="M17 249 H1 V233" stroke="var(--dim)" fill="none"/>

  <g class="rise d1">
    <rect x="32" y="27" width="9" height="9" fill="var(--signal)"/>
    <text class="mono" x="52" y="36" font-size="11" letter-spacing="3" fill="var(--ink)">SUBJECT PROFILE</text>
    <line x1="205" y1="31" x2="928" y2="31" stroke="var(--line)"/>
    <text class="mono" x="960" y="36" font-size="10" letter-spacing="1.5" fill="var(--dim)" text-anchor="end">~/whoami</text>
  </g>

  <g class="rise d2">
    <text class="mono" x="40" y="76" font-size="15" fill="var(--ink)">second-year BCA Honours student — Mar Baselios Institute of Technology and Science, Kerala.</text>
  </g>
  <g class="rise d3">
    <text class="mono" x="40" y="104" font-size="15" fill="var(--ink)">focused on AI, cybersecurity, and scalable systems.</text>
  </g>
  <g class="rise d4">
    <text class="mono" x="40" y="130" font-size="13.5" fill="var(--dim)">absurdist by temperament — building order into systems, on a rock that offers none.</text>
  </g>

  <line class="rise d4" x1="40" y1="152" x2="960" y2="152" stroke="var(--line)" opacity=".7"/>

  <g class="rise d5">
    <text class="mono" x="40"  y="184" font-size="11" letter-spacing="2.5" fill="var(--dim)">FOCUS</text>
    <text class="mono" x="180" y="184" font-size="14" fill="var(--ink)">AI Systems · Cybersecurity · Scalable Systems · Geospatial OSINT</text>
  </g>
  <g class="rise d5">
    <text class="mono" x="40"  y="210" font-size="11" letter-spacing="2.5" fill="var(--dim)">ENVIRONMENT</text>
    <text class="mono" x="180" y="210" font-size="14" fill="var(--ink)">Windows 11 + WSL2 Ubuntu · Zsh (Powerlevel10k)</text>
  </g>
  <g class="rise d6">
    <text class="mono" x="40"  y="234" font-size="11" letter-spacing="2.5" fill="var(--dim)">MEMBER</text>
    <text class="mono" x="180" y="234" font-size="14" fill="var(--signal)">IEEE</text>
  </g>
</svg>
