<svg viewBox="0 0 1000 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status: building. Kerala, India. arshadrafi.dev">
  <style>
    :root { --panel:#111318; --line:#2a2d33; --ink:#dde1e6; --dim:#6f7580; --signal:#b0552e; }
    .mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;}
    .rise{opacity:0;animation:rise .55s cubic-bezier(.2,.7,.2,1) forwards;}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .d1{animation-delay:.05s}.d2{animation-delay:.18s}
    .blink{animation:blink 2.4s ease-in-out infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1}.blink{animation:none}}
  </style>

  <rect x="1" y="1" width="998" height="98" rx="4" fill="var(--panel)" stroke="var(--line)"/>
  <path d="M1 17 V1 H17" stroke="var(--dim)" fill="none"/>
  <path d="M983 1 H999 V17" stroke="var(--dim)" fill="none"/>
  <path d="M999 83 V99 H983" stroke="var(--dim)" fill="none"/>
  <path d="M17 99 H1 V83" stroke="var(--dim)" fill="none"/>

  <g class="rise d1">
    <circle class="blink" cx="52" cy="42" r="4" fill="var(--signal)"/>
    <text class="mono" x="70" y="40" font-size="12" letter-spacing="2.5" fill="var(--ink)">STATUS — BUILDING</text>
    <text class="mono" x="70" y="60" font-size="10.5" letter-spacing="1" fill="var(--dim)">shipping in the gap between lectures and 2 AM</text>
  </g>
  <g class="rise d2">
    <text class="mono" x="960" y="46" font-size="13" text-anchor="end" fill="var(--dim)">arshadrafi.dev&#160;&#160;·&#160;&#160;github.com/Cigarfeine</text>
    <text class="mono" x="960" y="64" font-size="10.5" text-anchor="end" fill="var(--dim)">Kerala, India&#160;&#160;·&#160;&#160;&#169; 2026</text>
  </g>
</svg>
